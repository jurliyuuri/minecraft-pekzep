# Download-only. Do not upload from CI — Crowdin already holds the source.
# Crowdin stores the file as en_us.json; exports keep that name under the locale.

"project_id": "923393"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"base_path": "."
"preserve_hierarchy": true

"files": [
  {
    "source": "/source/en_us.json",
    "dest": "/en_us.json",
    "translation": "/translations/%locale%/%original_file_name%"
  }
]
