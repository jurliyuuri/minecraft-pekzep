name: Build resource pack

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Crowdin token
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "::error::Repository secret CROWDIN_PERSONAL_TOKEN is not set. Run: gh secret set CROWDIN_PERSONAL_TOKEN --repo jurliyuuri/minecraft-pekzep"
            exit 1
          fi

      - name: Download translations from Crowdin
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: "923393"
        run: python3 scripts/download_crowdin.py

      - name: List downloaded translations
        run: find translations -type f -print | sort

      - name: Fetch lin-marn noborder glyphs
        run: bash scripts/fetch_lin_marn.sh

      - name: Collect noborder paths
        run: |
          mkdir -p dist
          node scripts/collect_noborder.js vendor/lin-marn > dist/noborder.json

      - name: Build linzi font atlas
        run: |
          python3 -m pip install -r requirements-font.txt
          python3 scripts/build_linzi_font.py --glyphs dist/noborder.json

      - name: Build kanji pack
        run: python3 scripts/build_pack.py

      - name: Build linzi pack
        run: python3 scripts/build_pack.py --linzi

      - name: Publish release if pack changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_release.sh
